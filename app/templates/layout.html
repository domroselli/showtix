<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ShowTix{% endblock %} · ShowTix</title>
<style>
  :root { --ink: #1d1b22; --muted: #6b6574; --line: #e4e0ea; --accent: #b0225a; --bg: #fbfaf8; --error: #a11; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { border-bottom: 1px solid var(--line); background: #fff; }
  header a { color: var(--accent); font-weight: 700; text-decoration: none; font-size: 1.2rem; }
  header, main { padding: 12px 16px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 16px 0 4px; } h2 { margin-top: 32px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); margin-top: 0; }
  .show { border-top: 1px solid var(--line); padding: 12px 0; }
  .show h2 { margin: 0; font-size: 1.15rem; }
  .dates { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; list-style: none; }
  .dates a { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; text-decoration: none; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .total td { font-weight: 700; border-top: 2px solid var(--ink); }
  input { font: inherit; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; }
  input[type=number] { width: 4.5em; text-align: right; }
  button { font: inherit; padding: 6px 16px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .error { color: var(--error); background: #fdeeee; border: 1px solid #f3c4c4; padding: 8px 12px; border-radius: 4px; }
</style>
</head>
<body>
<header><a href="/">ShowTix</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
