<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img" aria-labelledby="title description">
<title id="title">Quote, order, cancel</title>
<desc id="description">A compact six-participant sequence of route calls to orders, inventory, promos, pricing and SQLite. Quote checks the performance, reads seats, checks the promo and calculates money without writes. Create starts BEGIN IMMEDIATE, repeats quote, saves a paid order and price snapshots, records promo use and commits before loading the saved order. Failures inside the transaction roll back. Quote and purchase have separate API and browser form URLs. Cancellation is API only; it changes status, and inventory excludes cancelled orders and releases their seats.</desc>
