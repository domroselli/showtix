[project]
name = "showtix"
version = "0.1.0"
description = "Ticketing backend for fictional Vegas shows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
